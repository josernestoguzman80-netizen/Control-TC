<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Bancario Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── Variables ─────────────────────────────────────── */
        :root {
            --primary:   #1a2744;
            --accent:    #2563eb;
            --green:     #059669;
            --red:       #dc2626;
            --amber:     #d97706;
            --sky:       #0284c7;
            --surface:   #ffffff;
            --border:    #e2e8f0;
            --muted:     #64748b;
            --text:      #0f172a;
            --mono:      'DM Mono', monospace;
        }

        /* ── Reset & base ──────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b1120;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% -10%, rgba(37,99,235,.28) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 110%,  rgba(5,150,105,.20) 0%, transparent 55%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            min-height: 100vh;
            padding: 24px 12px 48px;
            color: var(--text);
        }

        /* ── Container ─────────────────────────────────────── */
        .container {
            max-width: 1020px;
            margin: auto;
        }

        /* ── Page header ───────────────────────────────────── */
        .page-header {
            text-align: center;
            margin-bottom: 28px;
            color: #fff;
        }
        .page-header .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #93c5fd;
            margin-bottom: 14px;
        }
        .page-header h1 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            letter-spacing: -.02em;
            color: #fff;
        }
        .page-header p {
            font-size: 0.85rem;
            color: rgba(255,255,255,.45);
            margin-top: 4px;
        }

        /* ── Card base ─────────────────────────────────────── */
        .card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .card-body { padding: 20px 22px; }

        /* ── Config bar ────────────────────────────────────── */
        .config-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .input-group input {
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: var(--mono);
            width: 100%;
            background: #fff;
            color: var(--text);
            transition: border-color .15s;
        }
        .input-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
        .input-group input[readonly] { background: #f1f5f9; color: var(--muted); cursor: not-allowed; }

        /* ── Form compra ───────────────────────────────────── */
        .form-compra {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 28px;
        }
        @media (min-width: 600px) {
            .form-compra { grid-template-columns: 2fr 1fr 1.4fr auto; align-items: end; }
        }
        .btn-add {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: .02em;
            white-space: nowrap;
            transition: background .15s, transform .1s;
        }
        .btn-add:hover { background: #1d4ed8; }
        .btn-add:active { transform: scale(.97); }

        /* ── Ciclo card ─────────────────────────────────────── */
        .ciclo-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 22px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,.07);
        }
        .ciclo-header {
            background: linear-gradient(135deg, var(--primary) 0%, #243b6e 100%);
            color: #fff;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @media (min-width: 600px) {
            .ciclo-header { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        .ciclo-header .ciclo-title { font-size: 0.95rem; font-weight: 700; letter-spacing: .01em; }
        .ciclo-periodo {
            font-size: 0.72rem;
            font-weight: 400;
            color: rgba(255,255,255,.65);
            margin-top: 3px;
            font-family: var(--mono);
        }
        .btn-pagar-todo {
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.25);
            color: #fff;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.77rem;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background .15s;
        }
        .btn-pagar-todo:hover { background: rgba(255,255,255,.22); }

        /* ── Table ─────────────────────────────────────────── */
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 520px; }
        thead tr { background: #f8fafc; }
        th {
            padding: 10px 12px;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 2px solid var(--border);
        }
        td { padding: 11px 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #fafbfc; }

        .btn-delete { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 1.1rem; line-height: 1; transition: color .15s; }
        .btn-delete:hover { color: var(--red); }
        .check-pago { transform: scale(1.15); cursor: pointer; accent-color: var(--accent); }

        /* Row states */
        /* ── Edición inline ────────────────────────────────────── */
        .td-edit { padding: 0 !important; }
        .cell-input {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--text);
            outline: none;
            box-sizing: border-box;
            transition: background .15s, border-color .15s;
        }
        .cell-input:hover { background: #f0f9ff; border-bottom-color: #bfdbfe; }
        .cell-input:focus { background: #eff6ff; border-bottom-color: var(--accent); }
        .cell-input.mono { font-family: var(--mono); }
        .row-pagado .cell-input { color: #94a3b8 !important; text-decoration: line-through; }

        .row-pagado td { color: #94a3b8 !important; text-decoration: line-through; background: #f0fdf4; }
        .row-pagado { border-left: 3px solid #22c55e; }
        tbody tr:not(.row-pagado) { border-left: 3px solid transparent; }
        tbody tr:not(.row-pagado):hover { background: #f0f9ff; border-left-color: #93c5fd; }
        .row-pagado .btn-delete { opacity: .4; }

        /* Negative / credit row */
        .row-credito td.td-monto { color: var(--green) !important; font-weight: 600; }
        .row-credito td.td-desc { color: #047857; }
        .badge-credito {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 999px;
            letter-spacing: .04em;
        }

        /* ── Detalle fórmula ───────────────────────────────── */
        .detalle-calculo {
            background: #f0f7ff;
            padding: 10px 16px;
            font-size: 0.75rem;
            color: #334155;
            border-top: 1px dashed #bfdbfe;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            align-items: center;
        }
        .formula-chip {
            background: #dbeafe;
            color: #1e40af;
            border-radius: 5px;
            padding: 2px 8px;
            font-family: var(--mono);
            font-size: 0.72rem;
        }
        .formula-label { font-weight: 600; color: var(--primary); }

        /* ── Saldo arrastrado ──────────────────────────────── */
        .saldo-arrastrado-bar {
            background: #fefce8;
            border-top: 1px solid #fde68a;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .saldo-arrastrado-bar label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #92400e;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .saldo-arrastrado-bar input {
            width: 130px;
            padding: 6px 10px;
            border: 1.5px solid #fbbf24;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: var(--mono);
            background: #fff;
            color: #92400e;
            font-weight: 600;
        }
        .saldo-arrastrado-bar input:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217,119,6,.15);
        }
        .saldo-arrastrado-bar .sa-hint {
            font-size: 0.72rem;
            color: #b45309;
            opacity: .8;
        }

        /* ── Estado de cuenta (reconciliación banco) ──────── */
        .estado-cuenta {
            background: #f8fafc;
            border-top: 2px solid #e2e8f0;
            padding: 14px 18px;
        }
        .ec-title {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .ec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 0.85rem;
            border-bottom: 1px dashed #e2e8f0;
        }
        .ec-row:last-child { border-bottom: none; font-weight: 700; font-size: 0.95rem; }
        .ec-row .ec-label { color: #475569; }
        .ec-row .ec-val   { font-family: var(--mono); font-weight: 600; }
        .ec-row.ec-total  { border-top: 2px solid var(--primary); margin-top: 4px; padding-top: 8px; }
        .ec-pos  { color: var(--sky); }
        .ec-neg  { color: var(--green); }
        .ec-int  { color: var(--red); }
        .ec-tot  { color: var(--primary); }
        .ec-prev { color: var(--amber); }

        /* ── Panel de conciliación ────────────────────────── */
        .panel-conciliacion {
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #fff;
        }
        .conc-col {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .conc-col:first-child { border-right: 1px solid var(--border); }
        .conc-title {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .conc-title.consumos { color: var(--sky); }
        .conc-title.egresos  { color: var(--green); }
        .conc-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #475569;
        }
        .conc-row .val { font-family: var(--mono); font-weight: 600; }
        .conc-row .val.pos { color: var(--sky); }
        .conc-row .val.neg { color: var(--green); }
        .conc-row .val.net { color: var(--amber); }
        .conc-divider {
            border: none;
            border-top: 1px dashed var(--border);
            margin: 2px 0;
        }

        /* ── Resumen footer ────────────────────────────────── */
        .resumen-footer {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border-top: 1.5px solid var(--border);
            background: #f8fafc;
        }
        .resumen-item {
            padding: 14px 10px;
            text-align: center;
            border-right: 1px solid var(--border);
        }
        .resumen-item:last-child { border-right: none; }
        .resumen-item small {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .monto-footer { font-size: 1rem; font-weight: 700; font-family: var(--mono); display: block; }

        /* ── Banner vencimiento ────────────────────────────── */
        .banner-vence {
            background: linear-gradient(90deg, #0f172a 0%, var(--primary) 100%);
            color: rgba(255,255,255,.85);
            padding: 11px 18px;
            font-size: 0.82rem;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 20px;
            align-items: center;
        }
        .banner-vence b { color: #fbbf24; }

        /* ── Gran total ────────────────────────────────────── */
        .gran-total {
            background: linear-gradient(135deg, #92400e 0%, #b45309 100%);
            color: #fff;
            padding: 22px;
            border-radius: 14px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 8px 24px rgba(180,83,9,.35);
        }
        .gran-total .label { font-size: 0.75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
        .gran-total .monto-grande { font-size: 2rem; font-weight: 800; font-family: var(--mono); display: block; margin: 8px 0 4px; letter-spacing: -.02em; }
        .gran-total .sub { font-size: 0.8rem; opacity: .75; font-family: var(--mono); }

        /* ── Reset btn ─────────────────────────────────────── */
        .btn-reset {
            background: rgba(255,255,255,.06);
            color: rgba(255,255,255,.4);
            border: 1px solid rgba(255,255,255,.1);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            margin-top: 18px;
            width: 100%;
            transition: all .2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-reset:hover { background: rgba(220,38,38,.2); color: #fca5a5; border-color: rgba(220,38,38,.4); }
    </style>
</head>
<body onload="cargarDatos()">

<div class="container">

    <!-- ── Page header ──────────────────────────────────── -->
    <div class="page-header">
        <div class="logo-badge">⬡ Control Bancario Pro</div>
        <h1>Calendario de Pagos y Compras</h1>
        <p id="headerSub">Corte día 15  ·  Pago día 10  ·  Tasa 60% anual</p>
    </div>

    <!-- ── Config ──────────────────────────────────────── -->
    <div class="config-bar">
        <div class="input-group">
            <label>Día de Corte</label>
            <input type="number" id="cfgCorte" value="15" min="1" max="28" oninput="actualizarConfig()">
        </div>
        <div class="input-group">
            <label>Día de Pago</label>
            <input type="number" id="cfgPago" value="10" min="1" max="28" oninput="actualizarConfig()">
        </div>
        <div class="input-group">
            <label>Tasa Anual (%)</label>
            <input type="number" id="cfgTasa" value="60" min="0" step="0.01" oninput="actualizarConfig()">
        </div>
        <div class="input-group">
            <label title="Borra este campo para desactivar el cálculo de interés">Fórmula <span style="font-weight:400;opacity:.6">(vacío = sin interés)</span></label>
            <input type="text" id="cfgFormula" value="SPD × (Tasa/365) × días" oninput="actualizarConfig()" style="font-size:.78rem;">
        </div>
    </div>

    <!-- ── Formulario ──────────────────────────────────── -->
    <div class="form-compra">
        <div class="input-group">
            <label>Descripción</label>
            <input type="text" id="desc" placeholder="Ej: Gasolina, Pago TC…">
        </div>
        <div class="input-group">
            <label>Monto (Q)</label>
            <input type="number" id="monto" placeholder="0.00 (negativo = crédito)" step="0.01">
        </div>
        <div class="input-group">
            <label>Fecha</label>
            <input type="date" id="fechaCompra">
        </div>
        <button class="btn-add" onclick="registrar()">+ Registrar</button>
    </div>

    <!-- ── Ciclos ───────────────────────────────────────── -->
    <div id="contenedorCiclos"></div>

    <!-- ── Gran total ──────────────────────────────────── -->
    <div id="cajaGranTotal" class="gran-total" style="display:none;">
        <span class="label">Total Pendiente (Capital + Interés)</span>
        <span class="monto-grande">Q<span id="sumaPendienteGeneral">0.00</span></span>
        <div class="sub">
            Capital: Q<span id="soloCapital">0.00</span> &nbsp;|&nbsp; Interés: Q<span id="soloInteres">0.00</span>
        </div>
    </div>

    <button class="btn-reset" onclick="reiniciarTodo()">⚠ Reiniciar aplicación y borrar todos los datos</button>
</div>

<script>
    let todasLasCompras    = [];
    let saldosArrastrados  = {};   // { mesSort: amount } — overrides manuales del carry-over
    let interesesReales    = {};   // { mesSort: amount } — interés real del banco

    // ── Config dinámica ───────────────────────────────────────
    function getCORTE()     { return parseInt(document.getElementById('cfgCorte').value)  || 15; }
    function getPAGO()      { return parseInt(document.getElementById('cfgPago').value)   || 10; }
    function getTASA()      { return (parseFloat(document.getElementById('cfgTasa').value) || 0) / 100; }
    function getFormula()   { return document.getElementById('cfgFormula').value.trim(); }
    function usaInteres()   { return getFormula() !== ''; }

    function actualizarConfig() {
        // Actualizar subtítulo del header
        const corte = getCORTE(), pago = getPAGO(), tasa = document.getElementById('cfgTasa').value;
        document.getElementById('headerSub').textContent =
            `Corte día ${corte}  ·  Pago día ${pago}  ·  Tasa ${tasa}% anual`;
        // Guardar config en localStorage
        localStorage.setItem('configBancaria', JSON.stringify({
            corte: getCORTE(), pago: getPAGO(),
            tasa: document.getElementById('cfgTasa').value,
            formula: getFormula()
        }));
        render();
    }

    function cargarConfig() {
        const c = localStorage.getItem('configBancaria');
        if (!c) return;
        const cfg = JSON.parse(c);
        if (cfg.corte)   document.getElementById('cfgCorte').value   = cfg.corte;
        if (cfg.pago)    document.getElementById('cfgPago').value    = cfg.pago;
        if (cfg.tasa !== undefined) document.getElementById('cfgTasa').value = cfg.tasa;
        document.getElementById('cfgFormula').value = (cfg.formula !== undefined) ? cfg.formula : 'SPD × (Tasa/365) × días';
        actualizarConfig();
    }

    // ── Persistencia ─────────────────────────────────────────
    function guardarDatos() {
        localStorage.setItem('datosComprasGuzman', JSON.stringify(todasLasCompras));
        localStorage.setItem('saldosArrastrados',  JSON.stringify(saldosArrastrados));
        localStorage.setItem('interesesReales',    JSON.stringify(interesesReales));
    }
    function cargarDatos()  {
        cargarConfig();
        const d = localStorage.getItem('datosComprasGuzman');
        if (d) { todasLasCompras = JSON.parse(d); }
        const s = localStorage.getItem('saldosArrastrados');
        if (s) { saldosArrastrados = JSON.parse(s); }
        const ir = localStorage.getItem('interesesReales');
        if (ir) { interesesReales = JSON.parse(ir); }
        render();
    }
    function setInteresReal(mesSort, val) {
        const v = val.trim() === '' ? undefined : parseFloat(val);
        if (v === undefined) delete interesesReales[mesSort];
        else interesesReales[mesSort] = v;
        guardarDatos();
        render();
    }

    function setSaldoArrastrado(mesSort, val) {
        const v = parseFloat(val) || 0;
        saldosArrastrados[mesSort] = v;
        guardarDatos();
        render();
    }

    function setSaldoArrastrado(mesSort, val) {
        const v = val.trim() === '' ? undefined : parseFloat(val);
        if (v === undefined) {
            delete saldosArrastrados[mesSort];
        } else {
            saldosArrastrados[mesSort] = v;
        }
        guardarDatos();
        render();
    }

    function reiniciarTodo() {
        if (confirm("¿Borrar TODOS los datos? Esta acción no se puede deshacer.")) {
            todasLasCompras = [];
            localStorage.removeItem('datosComprasGuzman');
            render();
        }
    }

    // ── Parseo legacy DD/MM/YYYY ──────────────────────────────
    function tryParseFechaStr(str) {
        if (!str) return null;
        const p = str.split('/');
        if (p.length === 3) {
            const d = +p[0], m = +p[1], y = +p[2];
            if (!isNaN(d) && !isNaN(m) && !isNaN(y)) return new Date(y, m - 1, d);
        }
        return null;
    }

    // ── Cálculo SPD ───────────────────────────────────────────
    //   Interés = SPD × (Tasa / 365) × días del período
    //   EXCLUYE montos negativos (pagos / créditos)
    //   Si la fórmula está vacía → interés = 0
    // Recibe carryOver explícito (auto-detectado por el render loop)
    function calcularInteresCiclo(items, mesSort, carryOver) {
        carryOver = carryOver || 0;
        const CORTE = getCORTE(), PAGO = getPAGO();
        const TASA_DIARIA = getTASA() / 365;
        const year  = Math.floor(mesSort / 100);
        const month = mesSort % 100;

        const fechaCorte  = new Date(year, month - 2, CORTE);
        const inicioCiclo = new Date(year, month - 3, CORTE + 1);
        const diasPeriodo = Math.round((fechaCorte - inicioCiclo) / 86400000) + 1;

        // carryOver solo entra en SPD (interés), NO en capitalPendiente
        // El capital del ciclo anterior ya se cuenta en ese ciclo, no aquí
        let sumaPonderada    = carryOver * diasPeriodo;
        let capitalPendiente = 0;   // solo items de ESTE ciclo

        items.forEach(item => {
            const monto = Number(item.monto);
            if (!item.pagado) {
                capitalPendiente += monto;

                if (usaInteres()) {
                    const fc = item.fechaISO ? new Date(item.fechaISO) : tryParseFechaStr(item.fechaStr);
                    if (fc) {
                        const diasVigente = Math.max(1, Math.round((fechaCorte - fc) / 86400000) + 1);
                        sumaPonderada += monto * diasVigente;
                    }
                }
            }
        });

        // Verificar ANTES de clampear si la deuda quedó cubierta
        const netoTotal     = carryOver + capitalPendiente;   // puede ser negativo
        const deudaCubierta = netoTotal <= 0;

        sumaPonderada    = Math.max(0, sumaPonderada);
        capitalPendiente = Math.max(0, capitalPendiente);

        // Deuda cubierta → interés Q0.00 sin importar el SPD
        const spd     = (!deudaCubierta && usaInteres() && diasPeriodo > 0) ? sumaPonderada / diasPeriodo : 0;
        const interes = (!deudaCubierta && usaInteres()) ? spd * TASA_DIARIA * diasPeriodo : 0;

        return { spd, interes, diasPeriodo, fechaCorte, inicioCiclo, capitalPendiente, TASA_DIARIA, carryOver, netoTotal };
    }

    // ── Registrar ─────────────────────────────────────────────
    function registrar() {
        const d    = document.getElementById('desc').value.trim();
        const m    = parseFloat(document.getElementById('monto').value);
        const fTxt = document.getElementById('fechaCompra').value;
        if (!d || isNaN(m) || !fTxt) return alert("Completa todos los campos.");

        const partes = fTxt.split('-');
        const f = new Date(+partes[0], +partes[1] - 1, +partes[2]);
        let fLimite = new Date(f);
        const CORTE = getCORTE(), PAGO = getPAGO();
        if (f.getDate() > CORTE) fLimite.setMonth(fLimite.getMonth() + 2);
        else                      fLimite.setMonth(fLimite.getMonth() + 1);
        fLimite.setDate(PAGO);

        todasLasCompras.push({
            id: Date.now(), desc: d, monto: m, pagado: false,
            fechaStr:       f.toLocaleDateString('es-GT'),
            fechaISO:       fTxt,
            fechaLimiteStr: fLimite.toLocaleDateString('es-GT'),
            mesSort:        fLimite.getFullYear() * 100 + (fLimite.getMonth() + 1),
            nombreCiclo:    fLimite.toLocaleDateString('es-GT', { month: 'long', year: 'numeric' })
        });

        document.getElementById('desc').value  = '';
        document.getElementById('monto').value = '';
        guardarDatos(); render();
    }

    // ── Acciones ──────────────────────────────────────────────
    function editarItem(id, campo, valor) {
        const i = todasLasCompras.findIndex(x => x.id === id);
        if (i === -1) return;
        if (campo === 'monto') {
            const v = parseFloat(valor);
            if (isNaN(v)) return;
            todasLasCompras[i].monto = v;
        } else if (campo === 'desc') {
            if (!valor.trim()) return;
            todasLasCompras[i].desc = valor.trim();
        } else if (campo === 'fecha') {
            if (!valor) return;
            const partes = valor.split('-');
            const f = new Date(+partes[0], +partes[1]-1, +partes[2]);
            const CORTE = getCORTE(), PAGO = getPAGO();
            let fLimite = new Date(f);
            if (f.getDate() > CORTE) fLimite.setMonth(fLimite.getMonth() + 2);
            else                      fLimite.setMonth(fLimite.getMonth() + 1);
            fLimite.setDate(PAGO);
            todasLasCompras[i].fechaISO       = valor;
            todasLasCompras[i].fechaStr       = f.toLocaleDateString('es-GT');
            todasLasCompras[i].fechaLimiteStr = fLimite.toLocaleDateString('es-GT');
            todasLasCompras[i].mesSort        = fLimite.getFullYear() * 100 + (fLimite.getMonth() + 1);
            todasLasCompras[i].nombreCiclo    = fLimite.toLocaleDateString('es-GT', { month: 'long', year: 'numeric' });
        }
        guardarDatos();
        render();
    }

    function toggle(id) {
        const i = todasLasCompras.findIndex(x => x.id === id);
        todasLasCompras[i].pagado = !todasLasCompras[i].pagado;
        guardarDatos(); render();
    }
    function pagarTodoElMes(ms) {
        todasLasCompras.forEach(c => { if (c.mesSort == ms) c.pagado = true; });
        guardarDatos(); render();
    }
    function borrar(id) {
        todasLasCompras = todasLasCompras.filter(x => x.id !== id);
        guardarDatos(); render();
    }

    function fmtDate(d) { return d.toLocaleDateString('es-GT', { day:'numeric', month:'short', year:'numeric' }); }

    // ── Render ────────────────────────────────────────────────
    function render() {
        const scrollY = window.scrollY;   // guardar posición antes de re-renderizar
        const cont = document.getElementById('contenedorCiclos');
        cont.innerHTML = '';
        let capPendTotal = 0, intPendTotal = 0;

        const grupos = {};
        todasLasCompras.forEach(c => {
            if (!grupos[c.mesSort])
                grupos[c.mesSort] = { nombre: c.nombreCiclo, limite: c.fechaLimiteStr, items: [] };
            grupos[c.mesSort].items.push(c);
        });

        // ── Paso 1: calcular carry-overs secuencialmente ──────────
        const sortedKeys = Object.keys(grupos).sort((a,b) => a-b);
        let prevCarryOver = 0;
        const cicloCalcs  = {};

        sortedKeys.forEach(k => {
            const ciclo = grupos[k];
            ciclo.items.sort((a, b) => {
                const fa = a.fechaISO ? new Date(a.fechaISO) : tryParseFechaStr(a.fechaStr);
                const fb = b.fechaISO ? new Date(b.fechaISO) : tryParseFechaStr(b.fechaStr);
                return (fa || 0) - (fb || 0);
            });

            // Si hay override manual, úsalo en lugar del auto-calculado
            const effectiveCarryOver = (saldosArrastrados[k] !== undefined)
                ? saldosArrastrados[k]
                : prevCarryOver;
            const result = calcularInteresCiclo(ciclo.items, +k, effectiveCarryOver);  // result.netoTotal = raw net before clamp
            cicloCalcs[k] = result;

            // carry-over al siguiente ciclo:
            // Si hay items positivos sin pagar → acumula deuda (puede ser positivo o negativo/crédito)
            // Si todo está pagado → cero
            const tieneImpagoPositivo = ciclo.items.some(i => !i.pagado && Number(i.monto) > 0);
            if (tieneImpagoPositivo) {
                const intEf = (interesesReales[k] !== undefined) ? interesesReales[k] : result.interes;
                if (result.netoTotal <= 0) {
                    // Deuda cubierta: el crédito a favor (saldo negativo) pasa al siguiente ciclo
                    prevCarryOver = result.netoTotal;
                } else {
                    // Deuda pendiente: acumular capital + interés
                    prevCarryOver = effectiveCarryOver + result.capitalPendiente + intEf;
                }
            } else {
                prevCarryOver = 0;
            }
        });

        // prevCarryOver is now the true total outstanding balance after all cycles
        const totalPendienteReal = Math.max(0, prevCarryOver);

        // ── Paso 2: renderizar ─────────────────────────────────────
        sortedKeys.forEach(k => {
            const ciclo = grupos[k];
            const { spd, interes, diasPeriodo, fechaCorte, inicioCiclo, capitalPendiente, TASA_DIARIA, carryOver } =
                cicloCalcs[k];

            const interesEfectivo = (interesesReales[k] !== undefined) ? interesesReales[k] : interes;
            capPendTotal += capitalPendiente;
            intPendTotal += interesEfectivo;

            const tasaEfPct = (TASA_DIARIA * diasPeriodo * 100).toFixed(3);

            // ── Conciliación: consumos vs egresos ──────────────────
            let cntConsumos = 0, sumConsumos = 0;
            let cntEgresos  = 0, sumEgresos  = 0;
            ciclo.items.forEach(item => {
                const m = Number(item.monto);
                if (m > 0) { cntConsumos++; sumConsumos += m; }
                else        { cntEgresos++;  sumEgresos  += m; }
            });
            const saldoNeto = sumConsumos + sumEgresos;

            // ── Filas de la tabla ──
            let filas = '';
            ciclo.items.forEach(item => {
                const esCredito = Number(item.monto) < 0;
                const esPagado  = item.pagado;

                let diasCelda = '—';
                if (!esPagado && !esCredito) {   // credits never show days
                    const fc = item.fechaISO ? new Date(item.fechaISO) : tryParseFechaStr(item.fechaStr);
                    if (fc) diasCelda = Math.max(1, Math.round((fechaCorte - fc) / 86400000) + 1);
                }

                const rowClass = esPagado ? 'row-pagado' : (esCredito ? 'row-credito' : '');
                const montoFmt = esCredito
                    ? `Q${item.monto.toFixed(2)}`
                    : `Q${item.monto.toFixed(2)}`;

                const diasCol = esCredito
                    ? `<span class="badge-credito">CRÉDITO</span>`
                    : (esPagado ? '—' : diasCelda);

                const pagoBtn = esPagado
                    ? `<span style="color:#22c55e;font-size:1.1rem;cursor:pointer;" title="Pagado — clic para desmarcar" onclick="toggle(${item.id})">✓</span>`
                    : `<span style="color:#cbd5e1;font-size:1.1rem;cursor:pointer;" title="Marcar como pagado" onclick="toggle(${item.id})">○</span>`;

                filas += `
                <tr class="${rowClass}">
                    <td class="td-edit">
                        <input class="cell-input" type="date"
                            value="${item.fechaISO || ''}"
                            onchange="editarItem(${item.id},'fecha',this.value)"
                            title="Editar fecha">
                    </td>
                    <td class="td-edit">
                        <input class="cell-input" type="text"
                            value="${item.desc.replace(/"/g,'&quot;')}"
                            onchange="editarItem(${item.id},'desc',this.value)"
                            title="Editar descripción">
                    </td>
                    <td class="td-edit">
                        <input class="cell-input mono" type="number" step="0.01"
                            value="${item.monto}"
                            onchange="editarItem(${item.id},'monto',this.value)"
                            title="Editar monto (negativo = pago/crédito)">
                    </td>
                    <td>${diasCol}</td>
                    <td style="text-align:center;">${pagoBtn}</td>
                    <td><button class="btn-delete" onclick="borrar(${item.id})">✕</button></td>
                </tr>`;
            });

            const html = `
            <div class="ciclo-card">
                <div class="ciclo-header">
                    <div>
                        <div class="ciclo-title">PAGO ${ciclo.nombre.toUpperCase()}</div>
                        <div class="ciclo-periodo">
                            Período: ${fmtDate(inicioCiclo)} → ${fmtDate(fechaCorte)} &nbsp;·&nbsp; ${diasPeriodo} días
                        </div>
                    </div>
                    <button class="btn-pagar-todo" onclick="pagarTodoElMes(${k})">✓ Marcar todo pagado</button>
                </div>

                <!-- ── Saldo arrastrado (auto + override manual) ── -->
                <div class="saldo-arrastrado-bar" style="gap:12px;flex-wrap:wrap;align-items:center;">
                    ${carryOver < 0 ? `
                        <span style="font-size:0.75rem;font-weight:700;color:#065f46;text-transform:uppercase;letter-spacing:.05em;">✅ Crédito a favor: <span style="font-family:var(--mono)">Q${carryOver.toFixed(2)}</span></span>
                    ` : carryOver > 0 ? `
                        <span style="font-size:0.75rem;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.05em;">🔄 Arrastre auto: <span style="font-family:var(--mono);font-size:0.95rem;">Q${carryOver.toFixed(2)}</span></span>
                    ` : `
                        <span style="font-size:0.75rem;font-weight:600;color:#92400e;opacity:.7;">Sin arrastre anterior</span>
                    `}
                    <span style="margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                        <label style="display:flex;align-items:center;gap:5px;font-size:0.72rem;color:#92400e;font-weight:600;">
                            Saldo anterior (banco):
                            <input type="number" step="0.01"
                                style="width:105px;padding:5px 9px;border:1.5px solid #fbbf24;border-radius:6px;font-family:var(--mono);font-size:0.85rem;color:#92400e;background:#fff;font-weight:700;"
                                placeholder="${carryOver > 0 ? carryOver.toFixed(2) : '0.00'}"
                                value="${saldosArrastrados[k] !== undefined ? saldosArrastrados[k] : ''}"
                                onchange="setSaldoArrastrado(${k}, this.value)"
                                title="Valor del estado de cuenta del banco. Vacío = auto-calculado."
                            >
                        </label>
                        <label style="display:flex;align-items:center;gap:5px;font-size:0.72rem;color:#991b1b;font-weight:600;">
                            Interés del estado de cuenta:
                            <input type="number" step="0.01"
                                style="width:95px;padding:5px 9px;border:1.5px solid #f87171;border-radius:6px;font-family:var(--mono);font-size:0.85rem;color:#991b1b;background:#fff;font-weight:700;"
                                placeholder="estimado: ${interes.toFixed(2)}"
                                value="${interesesReales[k] !== undefined ? interesesReales[k] : ''}"
                                onchange="setInteresReal(${k}, this.value)"
                                title="Ingresa el interés exacto cuando recibas el estado de cuenta del banco. Mientras, el estimado (${interes.toFixed(2)}) se usa automáticamente."
                            >
                        </label>
                    </span>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead><tr>
                            <th>Fecha</th><th>Descripción</th>
                            <th>Monto</th><th>Días</th><th style="text-align:center;">OK</th><th></th>
                        </tr></thead>
                        <tbody>${filas}</tbody>
                    </table>
                </div>

                ${usaInteres() ? `
                <div class="detalle-calculo">
                    <span class="formula-label">Fórmula:</span>
                    <span>${getFormula().replace('Tasa', document.getElementById('cfgTasa').value+'%')} &nbsp;(${diasPeriodo}&thinsp;días)</span>
                    <span class="formula-chip">SPD = Q${spd.toFixed(2)}</span>
                    <span class="formula-chip">Tasa diaria = ${(TASA_DIARIA*100).toFixed(6)}%</span>
                    <span class="formula-chip">Tasa ef. período = ${tasaEfPct}%</span>
                </div>` : ''}

                <!-- ── Panel conciliación ── -->
                <div class="panel-conciliacion">
                    <div class="conc-col">
                        <div class="conc-title consumos">📥 Consumos</div>
                        <div class="conc-row"><span>Cantidad</span><span class="val pos">${cntConsumos} item${cntConsumos !== 1 ? 's' : ''}</span></div>
                        <div class="conc-row"><span>Total cargos</span><span class="val pos">Q${sumConsumos.toFixed(2)}</span></div>
                    </div>
                    <div class="conc-col">
                        <div class="conc-title egresos">📤 Egresos / Pagos</div>
                        <div class="conc-row"><span>Cantidad</span><span class="val neg">${cntEgresos} item${cntEgresos !== 1 ? 's' : ''}</span></div>
                        <div class="conc-row"><span>Total pagos</span><span class="val neg">Q${sumEgresos.toFixed(2)}</span></div>
                    </div>
                </div>
                <div style="padding:8px 16px;background:#fffbeb;border-top:1px solid #fde68a;font-size:0.78rem;display:flex;justify-content:space-between;align-items:center;">
                    <span style="color:#92400e;font-weight:600;">Saldo neto del ciclo</span>
                    <span style="font-family:var(--mono);font-weight:700;color:${saldoNeto >= 0 ? 'var(--sky)' : 'var(--green)'};">Q${saldoNeto.toFixed(2)}</span>
                </div>

                <!-- ── Estado de cuenta (comparar con banco) ── -->
                <div class="estado-cuenta">
                    <div class="ec-title">📋 Estado de Cuenta — compara con tu banco línea por línea</div>
                    <div class="ec-row">
                        <span class="ec-label">Saldo anterior (arrastre)</span>
                        <span class="ec-val ec-prev">+ Q${carryOver.toFixed(2)}</span>
                    </div>
                    <div class="ec-row">
                        <span class="ec-label">Consumos del período</span>
                        <span class="ec-val ec-pos">+ Q${sumConsumos.toFixed(2)}</span>
                    </div>
                    <div class="ec-row">
                        <span class="ec-label">Pagos / Créditos</span>
                        <span class="ec-val ec-neg">- Q${Math.abs(sumEgresos).toFixed(2)}</span>
                    </div>
                    <div class="ec-row">
                        <span class="ec-label">Interés por financiamiento</span>
                        <span class="ec-val ec-int">+ Q${interesEfectivo.toFixed(2)}</span>
                    </div>
                    <div class="ec-row ec-total">
                        <span class="ec-label ec-tot">NUEVO SALDO</span>
                        <span class="ec-val ec-tot">Q${Math.max(0, carryOver + sumConsumos + sumEgresos + interesEfectivo).toFixed(2)}</span>
                    </div>
                </div>

                <div class="resumen-footer">
                    <div class="resumen-item">
                        <small>Cargos Este Ciclo</small>
                        <span class="monto-footer" style="color:var(--sky)">Q${capitalPendiente.toFixed(2)}</span>
                        ${carryOver > 0 ? `<span style="font-size:0.68rem;color:var(--muted)">+ Q${carryOver.toFixed(2)} arrastrado</span>` : ''}
                    </div>
                    <div class="resumen-item">
                        <small>${interesesReales[k] !== undefined ? 'Interés (Banco)' : 'Interés Estimado'}</small>
                        <span class="monto-footer" style="color:var(--red)">Q${interesEfectivo.toFixed(2)}</span>
                    </div>
                    <div class="resumen-item">
                        <small>Total a Pagar</small>
                        <span class="monto-footer" style="color:var(--amber)">Q${(capitalPendiente + carryOver + interesEfectivo).toFixed(2)}</span>
                    </div>
                </div>

                <div class="banner-vence">
                    <span>Vence: <b>${ciclo.limite}</b></span>
                    ${carryOver > 0 ? `<span>Arrastrado: <b>Q${carryOver.toFixed(2)}</b></span>` : ''}
                    <span>Cargos: <b>Q${capitalPendiente.toFixed(2)}</b></span>
                    <span>Interés: <b>Q${interesEfectivo.toFixed(2)}</b></span>
                    <span>Total: <b>Q${(capitalPendiente + carryOver + interesEfectivo).toFixed(2)}</b></span>
                </div>
            </div>`;

            cont.innerHTML += html;
        }); // end sortedKeys render forEach

        // Capital = total real - todos los intereses acumulados
        const capEfectivo = Math.max(0, totalPendienteReal - intPendTotal);
        document.getElementById('soloCapital').innerText          = capEfectivo.toFixed(2);
        document.getElementById('soloInteres').innerText          = intPendTotal.toFixed(2);
        document.getElementById('sumaPendienteGeneral').innerText  = totalPendienteReal.toFixed(2);
        document.getElementById('cajaGranTotal').style.display    = todasLasCompras.length > 0 ? 'block' : 'none';
        window.scrollTo({ top: scrollY, behavior: 'instant' });   // restaurar posición
    }
</script>
</body>
</html>
